<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Zona Cuaderno Hub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // iOS hace zoom al enfocar un campo y no vuelve solo. Con maximum-scale=1 no lo hace, y Safari
    // igual deja hacer zoom con dos dedos (desde iOS 10 ignora maximum-scale para el gesto).
    // Solo en iOS: en Android maximum-scale sí bloquea el zoom con dos dedos.
    (function () {
      var ua = navigator.userAgent;
      var ios = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (!ios) return;
      var m = document.querySelector('meta[name="viewport"]');
      if (m) m.setAttribute('content', m.getAttribute('content') + ', maximum-scale=1');
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- PWA: instalable en iPhone/iPad (Safari → Agregar a inicio) y Android (Chrome → Instalar app). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ZC Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171a22" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('zc-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        var bar = theme === 'dark' ? '#171a22' : '#ffffff';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', bar); });
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
